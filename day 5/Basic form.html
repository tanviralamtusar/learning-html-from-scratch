<!DOCTYPE html>
<html>
    <body>
        <form>
            <label for="fullname">Full Name:</label>
            <input type="text" id="fullname" placeholder="Enter your full name">

            <input type="password" id="password" placeholder="Enter your password" maxlength="20">
