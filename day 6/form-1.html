<!DOCTYPE html>
<html>
    <body>
        <form>
            <p>Select a drink: </p>
            <input type="radio" name="drink" id="water">
            <label id="water">Water</label><br>
            <input type="radio" name="drink" id="coke">
            <label id="coke">Coke</label><br>
            <input type="radio" name="drink" id="sprite">
            <label id="sprite">Sprite</label>
            
            <p>Select extras: </p>
            <input type="checkbox" name="extras" id="ice">
            <label id="ice">Ice</label><br>
            <input type="checkbox" name="extras" id="lemon">
            <label id="lemon">Lemon</label><br>
            <input type="checkbox" name="extras" id="sugar">
            <label id="sugar">Sugar</label>
            
            <p>Select size: </p>
            <select name="size">
                <option>Small</option>
                <option>Medium</option>
                <option>Large</option>
            </select>
            <br>
            <button type="submit">Place Order</button>
            <button type="reset">Clear</button>
        </form>
    </body>
</html>
